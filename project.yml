name: AIRecorder
options:
  bundleIdPrefix: com.samuelzmx
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.samuelzmx.dawnrecorder
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  AIRecorder:
    type: application
    platform: iOS
    sources:
      - path: AIRecorder
      - path: Sources/RecorderCore
    settings:
      base:
        INFOPLIST_FILE: AIRecorder/Info.plist
        CODE_SIGN_ENTITLEMENTS: AIRecorder/AIRecorder.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
    scheme:
      testTargets:
        - RecorderCoreTests
        - AIRecorderUITests
  RecorderCoreTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests/RecorderCoreTests
    dependencies:
      - target: AIRecorder
  AIRecorderUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests/AIRecorderUITests
    dependencies:
      - target: AIRecorder
